# The redesigned site: built from site/, published from site/dist.
# The legacy single-file site in the repo root (index.html etc.) is no longer published from this branch.
[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# No catch-all rewrite: unknown URLs get the real 404 page (site/src/pages/404.astro).
